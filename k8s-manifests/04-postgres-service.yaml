apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: eda-app
spec:
  selector:
    app: postgres # Doit correspondre aux labels du Pod PostgreSQL
  ports:
    - protocol: TCP
      port: 5432 # Port exposé par le service
      targetPort: 5432 # Port du container PostgreSQL
  type: ClusterIP # Service accessible uniquement dans le cluster 